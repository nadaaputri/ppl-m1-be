services:
  db:
    image: postgres:16
    container_name: araya_m1_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - m1_db_data:/var/lib/postgresql/data

volumes:
  m1_db_data:
