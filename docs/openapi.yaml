openapi: 3.0.3

info:
  title: Araya Business Hub - API Modul M1
  version: 1.1.0
  description: |
    Dokumentasi REST API Backend Modul 1 (M1) Araya Business Hub.
    M1 menyediakan autentikasi terpusat, profil pengguna, pengelolaan akun,
    role, katalog permission, division, dan audit log.

    Semua endpoint resource M1 menggunakan prefix /api/m1/v1.
    Autentikasi pengguna menggunakan JWT Bearer HS256 dengan masa berlaku 8 jam.
    Format respons mengikuti envelope success/data/error.
    Timestamp respons menggunakan ISO 8601 dengan offset WIB (+07:00).

servers:
  - url: https://ppl-m1-be.vercel.app/api/m1/v1
    description: Production URL yang tercantum pada konfigurasi dokumentasi proyek
  - url: http://localhost:8080/api/m1/v1
    description: Local development

tags:
  - name: Health
    description: Pemeriksaan ketersediaan aplikasi dan database
  - name: API Documentation
    description: Spesifikasi OpenAPI dan halaman referensi API
  - name: Authentication
    description: Login, logout, profil pengguna, dan perubahan kata sandi
  - name: Users
    description: Pengelolaan akun pengguna oleh Super Admin
  - name: Roles
    description: Pengelolaan role platform dan penetapan permission
  - name: Permissions
    description: Katalog permission yang tersedia di M1
  - name: Divisions
    description: Pengelolaan master division platform
  - name: Audit Logs
    description: Riwayat aktivitas M1 dengan lingkup platform atau partner

security:
  - BearerAuth: []

paths:
  /health:
    servers:
      - url: https://ppl-m1-be.vercel.app
        description: Production
      - url: http://localhost:8080
        description: Local development
    get:
      tags: [Health]
      summary: Memeriksa apakah aplikasi berjalan
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Aplikasi berjalan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSuccess'
              example:
                success: true
                data:
                  status: ok

  /ready:
    servers:
      - url: https://ppl-m1-be.vercel.app
        description: Production
      - url: http://localhost:8080
        description: Local development
    get:
      tags: [Health]
      summary: Memeriksa kesiapan koneksi database
      operationId: readinessCheck
      security: []
      responses:
        '200':
          description: Database dapat diakses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessSuccess'
              example:
                success: true
                data:
                  status: ready
                  database: connected
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /openapi.yaml:
    servers:
      - url: https://ppl-m1-be.vercel.app
        description: Production
      - url: http://localhost:8080
        description: Local development
    get:
      tags: [API Documentation]
      summary: Mengambil file spesifikasi OpenAPI
      operationId: getOpenAPISpecification
      security: []
      responses:
        '200':
          description: Dokumen OpenAPI dalam format YAML
          content:
            application/yaml:
              schema:
                type: string

  /api/m1/v1/docs:
    servers:
      - url: https://ppl-m1-be.vercel.app
        description: Production
      - url: http://localhost:8080
        description: Local development
    get:
      tags: [API Documentation]
      summary: Membuka halaman referensi API
      description: Halaman Scalar API Reference yang membaca spesifikasi dari /openapi.yaml.
      operationId: getAPIReference
      security: []
      responses:
        '200':
          description: Halaman dokumentasi HTML
          content:
            text/html:
              schema:
                type: string

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login pengguna
      description: |
        Memvalidasi email, kata sandi, dan status aktif akun.
        Jika berhasil, M1 menerbitkan JWT bertanda tangan HS256.
        Masa berlaku token mengikuti konfigurasi wajib 8 jam.
        Kredensial salah dan akun nonaktif menghasilkan respons 401 yang sama.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@araya.example
              password: Password123
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
              example:
                success: true
                data:
                  access_token: "<jwt>"
                  token_type: Bearer
                  expires_in: 28800
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email, kata sandi, atau status akun tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: Email atau kata sandi salah
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/sessions/logout:
    post:
      tags: [Authentication]
      summary: Logout pengguna
      description: |
        Mencabut JWT yang dipakai pada request ini di server (denylist berdasarkan klaim jti
        sampai token kedaluwarsa) dan mencatat aksi LOGOUT di audit log.
        Setelah logout, token yang sama ditolak 401 di semua endpoint M1.
        Token dari sesi lain milik pengguna yang sama tidak ikut dicabut.
        Catatan integrasi: modul lain yang memverifikasi JWT sendiri tidak membaca denylist M1,
        sehingga token itu masih bisa diterima modul tersebut sampai exp kecuali modul
        memanggil GET /me.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullableSuccess'
              example:
                success: true
                data: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /me:
    get:
      tags: [Authentication]
      summary: Mendapatkan profil pengguna yang sedang login
      description: |
        Mengembalikan klaim profil dari JWT yang telah divalidasi.
        Field division, partner_id, dan unit_usaha_id dapat bernilai null.
        Respons profil ini tidak mengembalikan array permissions.
        Token yang sudah dicabut melalui logout ditolak dengan 401.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeSuccess'
              example:
                success: true
                data:
                  user_id: 42
                  name: Rani Kusumawati
                  role: administrator
                  division: pusat
                  partner_id: null
                  unit_usaha_id: null
                  is_super_admin: true
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Mengubah kata sandi pengguna sendiri
      description: |
        Pengguna harus mengirim kata sandi lama, kata sandi baru, dan konfirmasi.
        Kata sandi baru minimal 8 karakter, maksimal 72 byte, berisi huruf dan angka,
        tidak sama dengan email, dan tidak sama dengan kata sandi lama.
        Kata sandi disimpan menggunakan bcrypt.
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              old_password: OldPassword123
              new_password: NewPassword456
              confirm_password: NewPassword456
      responses:
        '200':
          description: Kata sandi berhasil diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordSuccess'
              example:
                success: true
                data:
                  changed_at: '2026-11-14T10:30:00+07:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: Kata sandi lama salah, data baru, atau konfirmasi tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                oldPasswordInvalid:
                  value:
                    success: false
                    error:
                      code: OLD_PASSWORD_INVALID
                      message: Kata sandi lama salah
                      fields:
                        old_password: Kata sandi lama salah
                confirmationMismatch:
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Data yang dikirim tidak valid
                      fields:
                        confirm_password: Konfirmasi kata sandi baru tidak cocok
                passwordPolicy:
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Data yang dikirim tidak valid
                      fields:
                        new_password: Harus berisi huruf dan angka
        '500':
          $ref: '#/components/responses/InternalError'

  /users:
    get:
      tags: [Users]
      summary: Mendapatkan daftar akun
      description: |
        Endpoint hanya dapat diakses Super Admin pada implementasi saat ini.
        Super Admin dapat melihat seluruh akun atau memfilter partner_id.
        Hasil kosong tetap dikembalikan sebagai HTTP 200 dengan data [].
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/PartnerIdFilter'
        - name: q
          in: query
          description: Pencarian berdasarkan nama atau email
          schema:
            type: string
        - name: role
          in: query
          description: Filter berdasarkan kode role
          schema:
            type: string
        - name: division
          in: query
          description: Filter berdasarkan kode division
          schema:
            type: string
        - name: unit_usaha_id
          in: query
          description: Filter berdasarkan ID unit usaha
          schema:
            type: integer
            format: int32
            minimum: 1
        - $ref: '#/components/parameters/IsActive'
        - name: sort
          in: query
          description: Urutan hasil. Default terbaru dibuat lebih dahulu.
          schema:
            type: string
            enum: [created_at, -created_at, name, -name, email, -email]
            default: -created_at
      responses:
        '200':
          description: Daftar akun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListSuccess'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Users]
      summary: Membuat akun pengguna
      description: |
        Hanya Super Admin yang dapat menggunakan endpoint ini.
        partner_id wajib dikirim oleh Super Admin.
        Role dan division harus merujuk pada data global yang aktif.
        Kode role partner tidak dapat dibuat melalui endpoint akun biasa;
        pembuatan akun awal Partner Admin dari M3 belum menjadi endpoint API pada versi ini.
        Password di-hash sebelum disimpan dan akun baru aktif secara default.
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              partner_id: 15
              name: Staf Operasional
              email: staf@partner.example
              password: Password123
              role: manajer
              division: operasional
              unit_usaha_id: 10
      responses:
        '201':
          description: Akun berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email telah digunakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: EMAIL_DUPLICATE
                  message: Email sudah terdaftar
        '422':
          description: Data akun, partner_id, role, atau division tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                missingPartner:
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Data yang dikirim tidak valid
                      fields:
                        partner_id: Isian ini wajib diisi
                invalidRole:
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Data yang dikirim tidak valid
                      fields:
                        role: Peran tidak terdaftar
                invalidDivision:
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Data yang dikirim tidak valid
                      fields:
                        division: Divisi tidak terdaftar
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Users]
      summary: Mendapatkan detail akun
      operationId: getUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Detail akun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccess'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Users]
      summary: Memperbarui data akun
      description: |
        Minimal satu field harus dikirim.
        Field yang dapat diperbarui: name, role, division, dan unit_usaha_id.
        Email dan partner_id tidak dapat diperbarui melalui endpoint ini.
      operationId: updateUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              name: Nama Pengguna Diperbarui
              division: keuangan
              unit_usaha_id: 12
      responses:
        '200':
          description: Akun berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Users]
      summary: Menonaktifkan akun
      description: |
        Menonaktifkan akun secara soft. Data historis tetap disimpan.
        Akun yang sedang digunakan tidak dapat dinonaktifkan oleh dirinya sendiri.
      operationId: deactivateUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Akun berhasil dinonaktifkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatusSuccess'
              example:
                success: true
                data:
                  id: 25
                  is_active: false
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/UserStatusConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Users]
      summary: Mengaktifkan atau menonaktifkan akun
      description: |
        Mengubah is_active tanpa menghapus data akun.
        Akun sendiri tidak boleh dinonaktifkan.
        Aktivasi ditolak apabila role atau division akun tidak aktif.
      operationId: setUserStatus
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusRequest'
            examples:
              activate:
                value:
                  is_active: true
              deactivate:
                value:
                  is_active: false
      responses:
        '200':
          description: Status akun berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatusSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Pengguna tidak memiliki kewenangan untuk mengubah status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: Anda tidak berhak mengubah status akun ini
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/UserStatusConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /roles:
    get:
      tags: [Roles]
      summary: Mendapatkan daftar role global
      description: |
        Hanya Super Admin. Endpoint mengembalikan role dengan partner_id NULL.
        Filter yang tersedia adalah is_active.
      operationId: listRoles
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/IsActive'
      responses:
        '200':
          description: Daftar role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListSuccess'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Roles]
      summary: Membuat role global
      description: |
        Hanya Super Admin. Role dibuat sebagai role global (partner_id NULL).
        permission_codes berisi kode dari katalog permission yang sudah ada.
        Kode role sistem tertentu dicadangkan dan tidak dapat dibuat ulang.
      operationId: createRole
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
            example:
              code: supervisor_gudang
              name: Supervisor Gudang
              description: Mengelola aktivitas gudang
              permission_codes:
                - m1.users.read
                - m1.audit.read
      responses:
        '201':
          description: Role berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Kode role sudah digunakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: ROLE_CODE_DUPLICATE
                  message: Kode peran sudah dipakai
        '422':
          description: Data role atau permission tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                reservedCode:
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Data yang dikirim tidak valid
                      fields:
                        code: Kode ini dicadangkan sistem
                unknownPermission:
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Data yang dikirim tidak valid
                      fields:
                        permission_codes: Permission tidak terdaftar
        '500':
          $ref: '#/components/responses/InternalError'

  /roles/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Roles]
      summary: Melihat permission yang terpasang pada role
      operationId: getRolePermissions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar kode permission pada role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionsSuccess'
              example:
                success: true
                data:
                  role_id: 4
                  permission_codes:
                    - m1.users.read
                    - m1.audit.read
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RoleNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Roles]
      summary: Mengganti daftar permission pada role
      description: |
        Mengganti seluruh daftar permission role dengan permission_codes yang dikirim.
        Array kosong diperbolehkan untuk menghapus seluruh penetapan permission role.
        Setiap kode harus ada pada katalog permission dan tidak boleh duplikat.
      operationId: setRolePermissions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRolePermissionsRequest'
            examples:
              assign:
                value:
                  permission_codes:
                    - m1.users.read
                    - m1.audit.read
              clear:
                value:
                  permission_codes: []
      responses:
        '200':
          description: Penetapan permission berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionsSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RoleNotFound'
        '422':
          description: Kode permission tidak valid, tidak terdaftar, atau duplikat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                unknownPermission:
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Data yang dikirim tidak valid
                      fields:
                        permission_codes: Permission tidak terdaftar
                duplicatePermission:
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Data yang dikirim tidak valid
                      fields:
                        permission_codes: Terdapat kode permission duplikat
        '500':
          $ref: '#/components/responses/InternalError'

  /permissions:
    get:
      tags: [Permissions]
      summary: Melihat katalog permission
      description: |
        Hanya Super Admin. Endpoint hanya membaca katalog permission yang sudah tersedia.
        Tidak ada endpoint publik untuk mendaftarkan permission baru.
      operationId: listPermissions
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListSuccess'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /divisions:
    get:
      tags: [Divisions]
      summary: Mendapatkan daftar division global
      description: |
        Hanya Super Admin. Endpoint mengembalikan division dengan partner_id NULL.
        Filter yang tersedia adalah is_active.
      operationId: listDivisions
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/IsActive'
      responses:
        '200':
          description: Daftar division
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DivisionListSuccess'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Divisions]
      summary: Membuat division global
      description: |
        Hanya Super Admin. Division baru dibuat sebagai data global (partner_id NULL).
        Kode harus menggunakan huruf kecil, angka, tanda hubung, atau garis bawah.
      operationId: createDivision
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDivisionRequest'
            example:
              code: operasional
              name: Operasional
      responses:
        '201':
          description: Division berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DivisionSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Kode division sudah digunakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: DIVISION_CODE_DUPLICATE
                  message: Kode divisi sudah dipakai
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /audit-logs:
    get:
      tags: [Audit Logs]
      summary: Melihat audit log dalam lingkup partner
      description: |
        Endpoint ditujukan untuk pengguna dengan role partner dan partner_id pada JWT.
        Data dibatasi ke partner_id milik token. Pengguna tanpa partner_id ditolak.
        Route memeriksa role partner dan permission m1.audit.read.
      operationId: listPartnerAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Audit log milik partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListSuccess'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /platform/audit-logs:
    get:
      tags: [Audit Logs]
      summary: Melihat audit log seluruh platform
      description: Hanya Super Admin. Data dikembalikan lintas partner dan diurutkan dari waktu terbaru.
      operationId: listPlatformAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Audit log platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListSuccess'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256 yang diterbitkan oleh endpoint login M1.

  parameters:
    Page:
      name: page
      in: query
      description: Nomor halaman, dimulai dari 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Jumlah item per halaman, maksimal 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IsActive:
      name: is_active
      in: query
      description: Filter status aktif.
      schema:
        type: boolean
    PartnerIdFilter:
      name: partner_id
      in: query
      description: Filter partner untuk Super Admin.
      schema:
        type: integer
        format: int32
        minimum: 1
    IdPath:
      name: id
      in: path
      required: true
      description: ID akun, role, atau resource sesuai endpoint.
      schema:
        type: integer
        format: int32
        minimum: 1

  schemas:
    HealthSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: ok

    ReadinessSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: ready
            database:
              type: string
              example: connected

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: admin@araya.example
        password:
          type: string
          minLength: 1
          maxLength: 72
          description: Batas implementasi adalah 72 byte.
          example: Password123

    LoginSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [access_token, token_type, expires_in]
          properties:
            access_token:
              type: string
              description: JWT access token.
            token_type:
              type: string
              enum: [Bearer]
            expires_in:
              type: integer
              description: Masa berlaku token dalam detik.
              example: 28800

    NullableSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
          description: Nilai null untuk respons logout.

    MeSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      required: [user_id, name, role, division, partner_id, unit_usaha_id, is_super_admin]
      properties:
        user_id:
          type: integer
          format: int32
        name:
          type: string
        role:
          type: string
        division:
          type: string
          nullable: true
        partner_id:
          type: integer
          format: int32
          nullable: true
        unit_usaha_id:
          type: integer
          format: int32
          nullable: true
        is_super_admin:
          type: boolean

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password, confirm_password]
      properties:
        old_password:
          type: string
          maxLength: 72
        new_password:
          type: string
          minLength: 8
          maxLength: 72
          description: Minimal 8 karakter, maksimal 72 byte, harus berisi huruf dan angka.
        confirm_password:
          type: string
          maxLength: 72
          description: Harus sama dengan new_password.

    ChangePasswordSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [changed_at]
          properties:
            changed_at:
              type: string
              format: date-time
              example: '2026-11-14T10:30:00+07:00'

    UserResponse:
      type: object
      required: [id, name, email, role, division, partner_id, unit_usaha_id, is_active, created_at]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          nullable: true
          description: Kode role.
        division:
          type: string
          nullable: true
          description: Kode division.
        partner_id:
          type: integer
          format: int32
          nullable: true
        unit_usaha_id:
          type: integer
          format: int32
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          example: '2026-11-14T09:15:00+07:00'

    UserSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserResponse'

    UserListSuccess:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CreateUserRequest:
      type: object
      required: [partner_id, name, email, password, role, division]
      properties:
        partner_id:
          type: integer
          format: int32
          minimum: 1
          description: Wajib untuk pembuatan akun oleh Super Admin.
        name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Minimal 8 karakter, berisi huruf dan angka, dan tidak sama dengan email.
        role:
          type: string
          description: Kode role global yang aktif. Kode partner tidak dapat dibuat melalui endpoint ini.
        division:
          type: string
          description: Kode division global yang aktif.
        unit_usaha_id:
          type: integer
          format: int32
          minimum: 1
          nullable: true

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        role:
          type: string
          pattern: '^[a-z0-9]+([_-][a-z0-9]+)*$'
        division:
          type: string
          pattern: '^[a-z0-9]+([_-][a-z0-9]+)*$'
        unit_usaha_id:
          type: integer
          format: int32
          minimum: 1

    UserStatusRequest:
      type: object
      required: [is_active]
      properties:
        is_active:
          type: boolean

    UserStatusSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [id, is_active]
          properties:
            id:
              type: integer
              format: int32
            is_active:
              type: boolean

    RoleResponse:
      type: object
      required: [id, partner_id, code, name, description, is_active, created_at]
      properties:
        id:
          type: integer
          format: int32
        partner_id:
          type: integer
          format: int32
          nullable: true
          description: NULL untuk role global yang dikelola M1.
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    RoleSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/RoleResponse'

    RoleListSuccess:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/RoleResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CreateRoleRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          maxLength: 50
          pattern: '^[a-z0-9]+([_-][a-z0-9]+)*$'
        name:
          type: string
          maxLength: 100
        description:
          type: string
        permission_codes:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Daftar permission dari katalog yang sudah tersedia. Boleh kosong atau tidak dikirim.

    RolePermissionsSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [role_id, permission_codes]
          properties:
            role_id:
              type: integer
              format: int32
            permission_codes:
              type: array
              items:
                type: string

    SetRolePermissionsRequest:
      type: object
      required: [permission_codes]
      properties:
        permission_codes:
          type: array
          uniqueItems: true
          items:
            type: string

    PermissionResponse:
      type: object
      required: [code, module, description]
      properties:
        code:
          type: string
        module:
          type: string
        description:
          type: string

    PermissionListSuccess:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    DivisionResponse:
      type: object
      required: [id, partner_id, code, name, is_active, created_at]
      properties:
        id:
          type: integer
          format: int32
        partner_id:
          type: integer
          format: int32
          nullable: true
          description: NULL untuk division global yang dikelola M1 pada implementasi saat ini.
        code:
          type: string
        name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    DivisionSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/DivisionResponse'

    DivisionListSuccess:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/DivisionResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CreateDivisionRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          maxLength: 50
          pattern: '^[a-z0-9]+([_-][a-z0-9]+)*$'
        name:
          type: string
          maxLength: 100

    AuditLogEntry:
      type: object
      required:
        - id
        - partner_id
        - user_id
        - action
        - resource
        - resource_id
        - old_value
        - new_value
        - ip_address
        - actor_name
        - actor_email
        - created_at
      properties:
        id:
          type: integer
          format: int32
        partner_id:
          type: integer
          format: int32
          nullable: true
        user_id:
          type: integer
          format: int32
          nullable: true
        action:
          type: string
        resource:
          type: string
        resource_id:
          type: integer
          format: int32
          nullable: true
        old_value:
          type: object
          nullable: true
          additionalProperties: true
        new_value:
          type: object
          nullable: true
          additionalProperties: true
        ip_address:
          type: string
          nullable: true
        actor_name:
          type: string
          nullable: true
        actor_email:
          type: string
          format: email
          nullable: true
        created_at:
          type: string
          format: date-time

    AuditLogListSuccess:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 57
        total_pages:
          type: integer
          example: 3

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ErrorObject'

    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: UNAUTHENTICATED
        message:
          type: string
          example: Sesi tidak valid atau telah berakhir, silakan login kembali

    ValidationErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message, fields]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Data yang dikirim tidak valid
            fields:
              type: object
              additionalProperties:
                type: string

  responses:
    BadRequest:
      description: Format permintaan tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: BAD_REQUEST
              message: Format permintaan tidak valid

    InvalidParameter:
      description: Parameter query atau path tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INVALID_PARAMETER
              message: Parameter tidak valid

    ValidationError:
      description: Field tidak lolos validasi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Data yang dikirim tidak valid
              fields:
                email: Format email tidak valid

    Unauthenticated:
      description: Token tidak ada, tidak valid, kedaluwarsa, atau sudah dicabut melalui logout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHENTICATED
              message: Sesi tidak valid atau telah berakhir, silakan login kembali

    Forbidden:
      description: Pengguna terautentikasi tetapi tidak memiliki akses
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: Anda tidak memiliki akses ke fitur ini

    UserNotFound:
      description: Akun tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: USER_NOT_FOUND
              message: Pengguna tidak ditemukan

    RoleNotFound:
      description: Role tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Peran tidak ditemukan

    UserStatusConflict:
      description: Perubahan status bertentangan dengan status atau aturan akun saat ini
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            cannotDeactivateSelf:
              value:
                success: false
                error:
                  code: CANNOT_DEACTIVATE_SELF
                  message: Tidak dapat menonaktifkan akun sendiri
            alreadyActive:
              value:
                success: false
                error:
                  code: USER_ALREADY_ACTIVE
                  message: Akun sudah aktif
            alreadyInactive:
              value:
                success: false
                error:
                  code: USER_ALREADY_INACTIVE
                  message: Akun sudah nonaktif
            referenceInactive:
              value:
                success: false
                error:
                  code: USER_REFERENCE_INACTIVE
                  message: Peran atau divisi akun nonaktif, ganti dulu sebelum mengaktifkan

    DatabaseUnavailable:
      description: Database tidak dapat diakses
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: DATABASE_UNAVAILABLE
              message: Database tidak dapat diakses

    InternalError:
      description: Kesalahan internal server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: Terjadi kesalahan pada server
