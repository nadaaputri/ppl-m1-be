
openapi: 3.0.3

info:
  title: Araya Business Hub - API Modul M1
  description: |
    REST API Modul M1: autentikasi, akun, peran, dan divisi.
    Autentikasi memakai JWT Bearer (HS256) berlaku 8 jam.
    Semua respons memakai amplop success/data/error.
    Tanggal dan jam memakai ISO 8601 zona WIB (+07:00).
  version: 1.0.0

servers:
  - url: https://ppl-m1-be.vercel.app
    description: Production (Vercel)
  - url: http://localhost:8080
    description: Local Development

tags:
  - name: Health
    description: Pemeriksaan kondisi server
  - name: Authentication
    description: Login, logout, profil, dan ubah kata sandi

security:
  - BearerAuth: []

paths:

  /health:
    get:
      tags:
        - Health
      summary: Cek kondisi server
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Server aktif
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /ready:
    get:
      tags:
        - Health
      summary: Cek kesiapan database
      operationId: readinessCheck
      security: []
      responses:
        '200':
          description: Database terhubung
          content:
            application/json:
              example:
                status: ready
                database: connected
        '503':
          description: Database tidak dapat diakses
          content:
            application/json:
              example:
                status: not ready
                error: database connection failed

  /api/m1/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Login pengguna
      description: |
        Email dan kata sandi valid menghasilkan JWT.
        Email tidak terdaftar, sandi salah, dan akun nonaktif
        dijawab sama (401 INVALID_CREDENTIALS).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: Email atau kata sandi salah
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/m1/v1/auth/sessions/logout:
    post:
      tags:
        [Authentication]
      summary: Logout pengguna
      description: |
        Token tidak dicabut di server. Logout hanya menghapus
        sesi di sisi klien, dan token tetap berlaku sampai exp.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              example:
                success: true
                data: null
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/m1/v1/me:
    get:
      tags:
        [Authentication]
      summary: Mendapatkan profil pengguna
      description: Mengambil informasi pengguna dari JWT.
      operationId: getCurrentUser
      responses:
        '200':
          description: Profil berhasil ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeSuccess'
              example:
                success: true
                data:
                  user_id: 42
                  name: Rani Kusumawati
                  role: kasir
                  division: penjualan
                  partner_id: 7
                  unit_usaha_id: 3
                  is_super_admin: false
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/m1/v1/auth/change-password:
    post:
      tags: [Authentication]
      summary: Ubah kata sandi sendiri
      description: |
        Sandi lama harus benar. Sandi baru minimal 8 karakter,
        berisi huruf dan angka, maksimal 72 byte, tidak sama
        dengan email, dan tidak sama dengan sandi lama.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Kata sandi berubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordSuccess'
              example:
                success: true
                data:
                  changed_at: '2026-11-11T14:30:00+07:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: Sandi lama salah atau isian tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                sandi_lama_salah:
                  value:
                    success: false
                    error:
                      code: OLD_PASSWORD_INVALID
                      message: Kata sandi lama salah
                      fields:
                        old_password: Kata sandi lama salah
                sandi_baru_lemah:
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Data yang dikirim tidak valid
                      fields:
                        new_password: Harus berisi huruf dan angka
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: kasir@contoh.id
        password:
          type: string
          maxLength: 72
          example: password123

    LoginSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
              description: JWT access token
            token_type:
              type: string
              example: Bearer
            expires_in:
              type: integer
              example: 28800

    MeSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        user_id: {type: integer, format: int32}
        name: {type: string}
        role: {type: string}
        division: {type: string, nullable: true}
        partner_id: {type: integer, format: int32, nullable: true}
        unit_usaha_id: {type: integer, format: int32, nullable: true}
        is_super_admin: {type: boolean}

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: {type: string, maxLength: 72}
        new_password: {type: string, minLength: 8, maxLength: 72}

    ChangePasswordSuccess:
      type: object
      properties:
        success: {type: boolean, example: true}
        data:
          type: object
          properties:
            changed_at: {type: string, format: date-time}

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Data yang dikirim tidak valid
            fields:
              type: object
              additionalProperties:
                type: string

  responses:

    BadRequest:
      description: Format permintaan tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: BAD_REQUEST
              message: Format permintaan tidak valid

    ValidationError:
      description: Data tidak lolos validasi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Data yang dikirim tidak valid
              fields:
                email: Format email tidak valid

    Unauthenticated:
      description: Token tidak valid atau kedaluwarsa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHENTICATED
              message: Sesi tidak valid atau telah berakhir, silakan login kembali

    InternalError:
      description: Kesalahan internal server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: Terjadi kesalahan pada server
